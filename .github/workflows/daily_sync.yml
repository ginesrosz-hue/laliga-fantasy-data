name: Actualización Diaria LaLiga Fantasy

on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '15 5 * * *'
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-mercado:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar el script extractor
        run: python sync_fantasy.py

      - name: Guardar y subir mercado_fantasy.json al repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git status
          git add mercado_fantasy.json
          git commit -m "Auto-actualización mercado $(date +'%d/%m/%Y %H:%M')"
          git push origin main
