name: Actualización Diaria LaLiga Fantasy

on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '15 5 * * *'
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-mercado:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar el script extractor
        run: python sync_fantasy.py

      - name: Guardar y subir mercado_fantasy.json al repositorio
        run: |
          git config user.name "LaLigaBot"
          git config user.email "bot@fantasy.github.internal"
          git add mercado_fantasy.json
          if git diff --staged --quiet; then
            echo "No hay cambios para subir"
          else
            git commit -m "Auto-actualización mercado [$(date +'%d/%m/%Y %H:%M')]"
            git push origin HEAD:main
          fi
