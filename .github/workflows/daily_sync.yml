name: Actualización Diaria LaLiga Fantasy

on:
  schedule:
    # Varios disparadores escalonados a partir de las 05:00 UTC (07:00 AM hora de España)
    - cron: '0 5 * * *'
    - cron: '15 5 * * *'
    - cron: '30 5 * * *'
  # Permite ejecutar el bot manualmente pulsando un botón
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-mercado:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias necesarias
        run: pip install requests beautifulsoup4

      - name: Ejecutar el script extractor
        run: python sync_fantasy.py

      - name: Guardar y subir mercado_fantasy.json al repositorio
        run: |
          git config --global user.name "LaLigaBot"
          git config --global user.email "bot@fantasy.github.internal"
          git add mercado_fantasy.json
          git diff --staged --quiet || (git commit -m "Auto-actualización mercado [$(date +'%d/%m/%Y %H:%M')]" && git push)
